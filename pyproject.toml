[project]
name = "emporio-da-musica-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (desafio técnico AI Engineer, Artefact)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2024.1",  # base de fusos horários; o Windows não traz
    "python-dotenv==1.2.4",
    "langgraph==1.2.19",
    "langchain-core==1.7.3",
    "langchain-ollama==1.1.0",
    "langchain-anthropic==1.7.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
